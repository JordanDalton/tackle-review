name: 'Tackle Review'
description: 'AI code review for Laravel pull requests: inline comments, incremental re-reviews, and optional merge gating.'
author: 'Jordan Dalton'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  api-key:
    description: 'API key for the configured provider. Exported as <PROVIDER>_API_KEY (e.g. provider: openai → OPENAI_API_KEY). Not needed for local providers like ollama.'
    required: false
    default: ''
  provider:
    description: 'laravel/ai provider name (anthropic, openai, gemini, groq, ollama, ...). Must match a key in the app''s config/ai.php. Defaults to the app''s configured provider (anthropic out of the box).'
    required: false
    default: ''
  model:
    description: 'Model to use, e.g. claude-sonnet-4-6 or gpt-5.2. Defaults to the app''s configured model.'
    required: false
    default: ''
  anthropic-api-key:
    description: 'Anthropic API key. Shorthand for api-key with the default provider; kept for backwards compatibility.'
    required: false
    default: ''
  price-input:
    description: 'Input price per million tokens, for accurate budget enforcement on non-default models. Set 0 for local models.'
    required: false
    default: ''
  price-output:
    description: 'Output price per million tokens, for accurate budget enforcement on non-default models. Set 0 for local models.'
    required: false
    default: ''
  github-token:
    description: 'Token used to fetch the PR and post the review. Needs pull-requests: write permission to comment.'
    required: false
    default: ${{ github.token }}
  comment:
    description: 'Post the findings to the PR as inline review comments (true/false).'
    required: false
    default: 'true'
  fail-on:
    description: 'Fail the check when findings at or above this severity exist: critical | warning | suggestion. Leave empty for an advisory review.'
    required: false
    default: ''
  full:
    description: 'Force a full review even when Tackle has already reviewed this PR (true/false). Default reviews only changes since the last Tackle review.'
    required: false
    default: 'false'
  focus:
    description: 'Comma-separated focus areas, e.g. "security,performance". Passed to --focus.'
    required: false
    default: ''
  php-version:
    description: 'PHP version to set up.'
    required: false
    default: '8.3'
  working-directory:
    description: 'Directory containing the Laravel app, for monorepos.'
    required: false
    default: '.'
  pr-number:
    description: 'Pull request number to operate on. When set, the action runs in dispatch mode: it checks out refs/pull/<pr-number>/head instead of relying on a pull_request event (for repository_dispatch triggers, e.g. Tackle Cloud).'
    required: false
    default: ''
  run-type:
    description: 'What to run: review (default) runs ai:review; task runs ai:run with the given task prompt.'
    required: false
    default: 'review'
  task:
    description: 'Task prompt for run-type: task. Passed to php artisan ai:run.'
    required: false
    default: ''
  budget:
    description: 'Spend limit in USD, passed as --budget on task runs.'
    required: false
    default: ''
  report-url:
    description: 'URL to POST the JSON result (tackle-result.json) to after the run, e.g. a Tackle Cloud ingest endpoint. Reporting is skipped when empty.'
    required: false
    default: ''
  report-token:
    description: 'Bearer token sent in the Authorization header when posting the result to report-url.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Require a pull_request event or an explicit pr-number
      if: github.event_name != 'pull_request' && inputs.pr-number == ''
      shell: bash
      run: |
        echo "::error::tackle-review must run on a pull_request event, or be given an explicit pr-number for dispatch triggers (got event: ${{ github.event_name }})."
        exit 1

    - name: Require a task prompt for task runs
      if: inputs.run-type == 'task' && inputs.task == ''
      shell: bash
      run: |
        echo "::error::run-type is 'task' but no task prompt was provided. Set the task input."
        exit 1

    - name: Require an API key
      if: inputs.api-key == '' && inputs.anthropic-api-key == '' && inputs.provider != 'ollama'
      shell: bash
      run: |
        echo "::error::No API key provided. Set api-key (with provider) or anthropic-api-key. Only local providers (ollama) can run without one."
        exit 1

    - name: Check out the pull request
      if: inputs.pr-number == ''
      uses: actions/checkout@v4

    - name: Check out the pull request head (dispatch mode)
      if: inputs.pr-number != ''
      uses: actions/checkout@v4
      with:
        ref: refs/pull/${{ inputs.pr-number }}/head
        fetch-depth: 0

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none

    - name: Install Composer dependencies
      uses: ramsey/composer-install@v3
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Verify Laravel Tackle is installed
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if ! composer show jordandalton/laravel-tackle >/dev/null 2>&1; then
          echo "::error::jordandalton/laravel-tackle is not installed in this app. Run: composer require jordandalton/laravel-tackle"
          exit 1
        fi

    - name: Run Tackle
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPO: ${{ github.repository }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_RUN_TYPE: ${{ inputs.run-type }}
        INPUT_TASK: ${{ inputs.task }}
        INPUT_BUDGET: ${{ inputs.budget }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_PRICE_INPUT: ${{ inputs.price-input }}
        INPUT_PRICE_OUTPUT: ${{ inputs.price-output }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FULL: ${{ inputs.full }}
        INPUT_FOCUS: ${{ inputs.focus }}
      run: |
        if [ -n "$INPUT_ANTHROPIC_API_KEY" ]; then
          export ANTHROPIC_API_KEY="$INPUT_ANTHROPIC_API_KEY"
        fi

        # Route the generic key to the provider's conventional env var:
        # openai -> OPENAI_API_KEY, gemini -> GEMINI_API_KEY, etc.
        if [ -n "$INPUT_API_KEY" ]; then
          PROVIDER="${INPUT_PROVIDER:-anthropic}"
          KEY_VAR="$(echo "$PROVIDER" | tr '[:lower:]-' '[:upper:]_')_API_KEY"
          export "$KEY_VAR=$INPUT_API_KEY"
        fi

        if [ -n "$INPUT_PROVIDER" ]; then export AI_CODE_PROVIDER="$INPUT_PROVIDER"; fi
        if [ -n "$INPUT_MODEL" ]; then export AI_CODE_MODEL="$INPUT_MODEL"; fi
        if [ -n "$INPUT_PRICE_INPUT" ]; then export AI_CODE_PRICE_INPUT="$INPUT_PRICE_INPUT"; fi
        if [ -n "$INPUT_PRICE_OUTPUT" ]; then export AI_CODE_PRICE_OUTPUT="$INPUT_PRICE_OUTPUT"; fi

        # An explicit pr-number (dispatch mode) wins over the event context.
        PR_NUMBER="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
        export PR_NUMBER

        if [ "$INPUT_RUN_TYPE" = "task" ]; then
          CMD=(ai:run "$INPUT_TASK" --output=json --allowlist)
          if [ -n "$INPUT_BUDGET" ]; then CMD+=(--budget="$INPUT_BUDGET"); fi
        else
          CMD=(ai:review --pr="$PR_NUMBER" --output=json)
          if [ "$INPUT_COMMENT" = "true" ]; then CMD+=(--comment); fi
          if [ -n "$INPUT_FAIL_ON" ]; then CMD+=(--fail-on="$INPUT_FAIL_ON"); fi
          if [ "$INPUT_FULL" = "true" ]; then CMD+=(--full); fi
          if [ -n "$INPUT_FOCUS" ]; then CMD+=(--focus="$INPUT_FOCUS"); fi
        fi

        # In JSON mode the machine-readable result goes to stdout and human
        # diagnostics go to stderr. Capture the exit code without failing the
        # step; it is re-raised after the result has been reported.
        set +e
        php artisan "${CMD[@]}" > tackle-result.json
        EXIT_CODE=$?
        set -e
        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        echo "Tackle finished with exit code $EXIT_CODE (result in tackle-result.json)."

    - name: Report the result
      if: always() && inputs.report-url != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT_URL: ${{ inputs.report-url }}
        REPORT_TOKEN: ${{ inputs.report-token }}
      run: |
        if [ -s tackle-result.json ]; then
          DATA=(--data-binary '@tackle-result.json')
        else
          echo "::warning::tackle-result.json is missing or empty; reporting an error result."
          DATA=(--data '{"ok":false,"outcome":"error","error":"no result produced"}')
        fi
        if ! curl -sS --max-time 30 -X POST \
          -H "Authorization: Bearer $REPORT_TOKEN" \
          -H "Content-Type: application/json" \
          "${DATA[@]}" "$REPORT_URL"; then
          echo "::warning::Failed to POST the result to report-url (the run outcome is unaffected)."
        fi

    - name: Propagate the run exit code
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "${EXIT_CODE:-1}"
