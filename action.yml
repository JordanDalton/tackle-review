name: 'Tackle Review'
description: 'AI code review for Laravel pull requests: inline comments, incremental re-reviews, and optional merge gating.'
author: 'Jordan Dalton'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  api-key:
    description: 'API key for the configured provider. Exported as <PROVIDER>_API_KEY (e.g. provider: openai → OPENAI_API_KEY). Not needed for local providers like ollama.'
    required: false
    default: ''
  provider:
    description: 'laravel/ai provider name (anthropic, openai, gemini, groq, ollama, ...). Must match a key in the app''s config/ai.php. Defaults to the app''s configured provider (anthropic out of the box).'
    required: false
    default: ''
  model:
    description: 'Model to use, e.g. claude-sonnet-4-6 or gpt-5.2. Defaults to the app''s configured model.'
    required: false
    default: ''
  anthropic-api-key:
    description: 'Anthropic API key. Shorthand for api-key with the default provider; kept for backwards compatibility.'
    required: false
    default: ''
  price-input:
    description: 'Input price per million tokens, for accurate budget enforcement on non-default models. Set 0 for local models.'
    required: false
    default: ''
  price-output:
    description: 'Output price per million tokens, for accurate budget enforcement on non-default models. Set 0 for local models.'
    required: false
    default: ''
  github-token:
    description: 'Token used to fetch the PR and post the review. Needs pull-requests: write permission to comment.'
    required: false
    default: ${{ github.token }}
  comment:
    description: 'Post the findings to the PR as inline review comments (true/false).'
    required: false
    default: 'true'
  fail-on:
    description: 'Fail the check when findings at or above this severity exist: critical | warning | suggestion. Leave empty for an advisory review.'
    required: false
    default: ''
  full:
    description: 'Force a full review even when Tackle has already reviewed this PR (true/false). Default reviews only changes since the last Tackle review.'
    required: false
    default: 'false'
  focus:
    description: 'Comma-separated focus areas, e.g. "security,performance". Passed to --focus.'
    required: false
    default: ''
  php-version:
    description: 'PHP version to set up.'
    required: false
    default: '8.3'
  working-directory:
    description: 'Directory containing the Laravel app, for monorepos.'
    required: false
    default: '.'
  pr-number:
    description: 'Pull request number to operate on. When set, the action runs in dispatch mode: it checks out refs/pull/<pr-number>/head instead of relying on a pull_request event (for repository_dispatch triggers, e.g. Tackle Cloud).'
    required: false
    default: ''
  run-type:
    description: 'What to run: review (default) runs ai:review; task runs ai:run with the given task prompt; upgrade runs ai:upgrade --headless for the given packages.'
    required: false
    default: 'review'
  task:
    description: 'Task prompt for run-type: task. Passed to php artisan ai:run.'
    required: false
    default: ''
  packages:
    description: 'Composer packages to upgrade for run-type: upgrade, space- or comma-separated (e.g. "pestphp/pest spatie/laravel-permission"). Each package gets its own headless session and pull request. Requires jordandalton/laravel-tackle >= 1.27.'
    required: false
    default: ''
  ref-issue:
    description: 'GitHub issue number the upgrade PR(s) reference as "Refs #N" — typically the audit issue maintained by ai:upgrade --audit --issue. Upgrade runs only.'
    required: false
    default: ''
  budget:
    description: 'Spend limit in USD, passed as --budget on task and upgrade runs (per package for upgrades).'
    required: false
    default: ''
  app-env:
    description: 'APP_ENV for task and upgrade runs. Controls Tackle''s environment-keyed safety allowlists; the CI checkout is disposable, so local is the default.'
    required: false
    default: 'local'
  report-url:
    description: 'URL to POST the JSON result (tackle-result.json) to after the run, e.g. a Tackle Cloud ingest endpoint. Reporting is skipped when empty.'
    required: false
    default: ''
  report-started-url:
    description: 'URL to POST an empty "run started" ping to before the run begins (e.g. a Tackle Cloud status endpoint). Skipped when empty.'
    required: false
    default: ''
  report-progress-url:
    description: 'URL to POST the agent''s accumulated diagnostic output to every few seconds while it works (e.g. a Tackle Cloud progress endpoint). Skipped when empty.'
    required: false
    default: ''
  report-token:
    description: 'Bearer token sent in the Authorization header when posting the result to report-url.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Best-effort log hygiene: the ingest token also appears in the
    # repository_dispatch client_payload (visible to repo readers), so this
    # only reduces incidental exposure in later step logs.
    - name: Mask the report token
      if: inputs.report-token != ''
      shell: bash
      env:
        REPORT_TOKEN: ${{ inputs.report-token }}
      run: echo "::add-mask::$REPORT_TOKEN"

    - name: Report the run start
      if: inputs.report-started-url != '' || inputs.report-url != ''
      shell: bash
      env:
        STARTED_URL: ${{ inputs.report-started-url }}
        REPORT_URL: ${{ inputs.report-url }}
        REPORT_TOKEN: ${{ inputs.report-token }}
      run: |
        # Derive from the result URL when not given explicitly.
        STARTED_URL="${STARTED_URL:-${REPORT_URL%/result}/started}"
        curl -sS --max-time 15 -X POST \
          -H "Authorization: Bearer $REPORT_TOKEN" \
          "$STARTED_URL" >/dev/null \
          || echo "::warning::Failed to POST the started ping (the run is unaffected)."

    - name: Require a pull_request event or an explicit pr-number
      if: github.event_name != 'pull_request' && inputs.pr-number == '' && inputs.run-type != 'task' && inputs.run-type != 'upgrade'
      shell: bash
      run: |
        echo "::error::tackle-review reviews need a pull_request event or an explicit pr-number; task and upgrade runs need neither (got event: ${{ github.event_name }})."
        exit 1

    - name: Require a task prompt for task runs
      if: inputs.run-type == 'task' && inputs.task == ''
      shell: bash
      run: |
        echo "::error::run-type is 'task' but no task prompt was provided. Set the task input."
        exit 1

    - name: Require packages for upgrade runs
      if: inputs.run-type == 'upgrade' && inputs.packages == ''
      shell: bash
      run: |
        echo "::error::run-type is 'upgrade' but no packages were provided. Set the packages input — headless upgrades never pick their own targets."
        exit 1

    - name: Require an API key
      if: inputs.api-key == '' && inputs.anthropic-api-key == '' && inputs.provider != 'ollama'
      shell: bash
      run: |
        echo "::error::No API key provided. Set api-key (with provider) or anthropic-api-key. Only local providers (ollama) can run without one."
        exit 1

    - name: Check out the pull request
      if: inputs.pr-number == ''
      uses: actions/checkout@v4

    - name: Check out the pull request head (dispatch mode)
      if: inputs.pr-number != ''
      uses: actions/checkout@v4
      with:
        ref: refs/pull/${{ inputs.pr-number }}/head
        fetch-depth: 0

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none

    - name: Install Composer dependencies
      uses: ramsey/composer-install@v3
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Verify Laravel Tackle is installed
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if ! composer show jordandalton/laravel-tackle >/dev/null 2>&1; then
          echo "::error::jordandalton/laravel-tackle is not installed in this app. Run: composer require jordandalton/laravel-tackle"
          exit 1
        fi

    - name: Verify ai:upgrade is available
      if: inputs.run-type == 'upgrade'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if ! php artisan list --raw 2>/dev/null | grep -q '^ai:upgrade'; then
          echo "::error::This app's jordandalton/laravel-tackle does not ship ai:upgrade. Upgrade it: composer require jordandalton/laravel-tackle:^1.27"
          exit 1
        fi

    - name: Run Tackle
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPO: ${{ github.repository }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_RUN_TYPE: ${{ inputs.run-type }}
        INPUT_TASK: ${{ inputs.task }}
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_REF_ISSUE: ${{ inputs.ref-issue }}
        INPUT_BUDGET: ${{ inputs.budget }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_PRICE_INPUT: ${{ inputs.price-input }}
        INPUT_PRICE_OUTPUT: ${{ inputs.price-output }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FULL: ${{ inputs.full }}
        INPUT_FOCUS: ${{ inputs.focus }}
        INPUT_APP_ENV: ${{ inputs.app-env }}
        REPORT_PROGRESS_URL: ${{ inputs.report-progress-url }}
        REPORT_URL_FOR_DERIVE: ${{ inputs.report-url }}
        REPORT_TOKEN: ${{ inputs.report-token }}
      run: |
        if [ -n "$INPUT_ANTHROPIC_API_KEY" ]; then
          export ANTHROPIC_API_KEY="$INPUT_ANTHROPIC_API_KEY"
        fi

        # Route the generic key to the provider's conventional env var:
        # openai -> OPENAI_API_KEY, gemini -> GEMINI_API_KEY, etc.
        if [ -n "$INPUT_API_KEY" ]; then
          PROVIDER="${INPUT_PROVIDER:-anthropic}"
          KEY_VAR="$(echo "$PROVIDER" | tr '[:lower:]-' '[:upper:]_')_API_KEY"
          export "$KEY_VAR=$INPUT_API_KEY"
        fi

        if [ -n "$INPUT_PROVIDER" ]; then export AI_CODE_PROVIDER="$INPUT_PROVIDER"; fi
        if [ -n "$INPUT_MODEL" ]; then export AI_CODE_MODEL="$INPUT_MODEL"; fi
        if [ -n "$INPUT_PRICE_INPUT" ]; then export AI_CODE_PRICE_INPUT="$INPUT_PRICE_INPUT"; fi
        if [ -n "$INPUT_PRICE_OUTPUT" ]; then export AI_CODE_PRICE_OUTPUT="$INPUT_PRICE_OUTPUT"; fi

        # An explicit pr-number (dispatch mode) wins over the event context.
        PR_NUMBER="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
        export PR_NUMBER

        if [ "$INPUT_RUN_TYPE" = "task" ]; then
          # The CI checkout is a disposable sandbox: run task work under the
          # given APP_ENV so Tackle's environment-keyed allowlists (make:*,
          # migrate:*, ...) permit code generation. Defaults to local.
          export APP_ENV="${INPUT_APP_ENV:-local}"
          # Give the agent a git identity so it can commit and open PRs itself.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --yes: headless CI has no one to answer confirmation prompts.
          CMD=(ai:run "$INPUT_TASK" --output=json --allowlist --yes)
          if [ -n "$INPUT_BUDGET" ]; then CMD+=(--budget="$INPUT_BUDGET"); fi
        elif [ "$INPUT_RUN_TYPE" = "upgrade" ]; then
          # Same disposable-sandbox posture as task runs.
          export APP_ENV="${INPUT_APP_ENV:-local}"
          # Give the agent a git identity so it can commit and open PRs itself.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ai:upgrade opens its own PR per package. --no-worktree because the
          # checkout is already disposable; composer lifecycle scripts stay
          # suppressed by construction in headless mode.
          read -r -a PACKAGES <<< "$(echo "$INPUT_PACKAGES" | tr ',' ' ')"
          CMD=(ai:upgrade "${PACKAGES[@]}" --headless --output=json --no-worktree --allowlist)
          if [ -n "$INPUT_BUDGET" ]; then CMD+=(--budget="$INPUT_BUDGET"); fi
          if [ -n "$INPUT_REF_ISSUE" ]; then CMD+=(--ref-issue="$INPUT_REF_ISSUE"); fi
        else
          CMD=(ai:review --pr="$PR_NUMBER" --output=json)
          if [ "$INPUT_COMMENT" = "true" ]; then CMD+=(--comment); fi
          if [ -n "$INPUT_FAIL_ON" ]; then CMD+=(--fail-on="$INPUT_FAIL_ON"); fi
          if [ "$INPUT_FULL" = "true" ]; then CMD+=(--full); fi
          if [ -n "$INPUT_FOCUS" ]; then CMD+=(--focus="$INPUT_FOCUS"); fi
        fi

        # In JSON mode the machine-readable result goes to stdout and human
        # diagnostics go to stderr. Capture the exit code without failing the
        # step; it is re-raised after the result has been reported.
        # Stream the agent's diagnostic output to the dispatcher while it works.
        PROGRESS_LOG="$RUNNER_TEMP/tackle-progress.log"
        : > "$PROGRESS_LOG"
        PROGRESS_PID=""
        REPORT_PROGRESS_URL="${REPORT_PROGRESS_URL:-${REPORT_URL_FOR_DERIVE:+${REPORT_URL_FOR_DERIVE%/result}/progress}}"
        if [ -n "$REPORT_PROGRESS_URL" ] && [ -n "$REPORT_TOKEN" ]; then
          (
            while sleep 4; do
              [ -s "$PROGRESS_LOG" ] || continue
              curl -sS --max-time 10 -X POST \
                -H "Authorization: Bearer $REPORT_TOKEN" \
                -H "Content-Type: text/plain" \
                --data-binary @"$PROGRESS_LOG" "$REPORT_PROGRESS_URL" >/dev/null 2>&1 || true
            done
          ) &
          PROGRESS_PID=$!
        fi

        set +e
        php artisan "${CMD[@]}" > "$RUNNER_TEMP/tackle-result.json" 2> >(tee -a "$PROGRESS_LOG" >&2)
        EXIT_CODE=$?
        set -e
        if [ -n "$PROGRESS_PID" ]; then kill "$PROGRESS_PID" 2>/dev/null || true; fi
        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        echo "Tackle finished with exit code $EXIT_CODE (result in tackle-result.json)."

        # Safety net: the checkout is destroyed when the job ends, so any
        # task work left uncommitted would be lost. Commit, push, and open a
        # PR deterministically, then record its URL in the result document.
        if [ "$INPUT_RUN_TYPE" = "task" ] && [ "$EXIT_CODE" -eq 0 ] && [ -n "$(git status --porcelain)" ]; then
          EXISTING_PR_URL="$(jq -r '.pr_url // empty' "$RUNNER_TEMP/tackle-result.json" 2>/dev/null || true)"
          if [ -z "$EXISTING_PR_URL" ]; then
            BRANCH="tackle/task-${GITHUB_RUN_ID:-manual}"
            TITLE="$(echo "$INPUT_TASK" | head -c 60 | tr '\n' ' ')"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "Tackle task: $TITLE"
            git push origin "$BRANCH"
            RESPONSE="$(jq -n --arg t "Tackle task: $TITLE" --arg h "$BRANCH" --arg b "$GITHUB_REF_NAME" --arg body "$INPUT_TASK" \
              '{title: $t, head: $h, base: $b, body: ("Automated task run.\n\n> " + $body)}' \
              | curl -sS -X POST \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data @- "https://api.github.com/repos/$GITHUB_REPO/pulls")"
            PR_URL="$(echo "$RESPONSE" | jq -r '.html_url // empty')"
            if [ -n "$PR_URL" ]; then
              echo "Opened $PR_URL for the task changes."
              jq --arg u "$PR_URL" '.pr_url = $u' "$RUNNER_TEMP/tackle-result.json" > "$RUNNER_TEMP/tackle-result.tmp" \
                && mv "$RUNNER_TEMP/tackle-result.tmp" "$RUNNER_TEMP/tackle-result.json"
            else
              MESSAGE="$(echo "$RESPONSE" | jq -r '.message // "unknown error"')"
              echo "::warning::Pushed $BRANCH but could not open a PR: $MESSAGE. If GitHub Actions may not create pull requests here, enable it under Settings -> Actions -> General -> Workflow permissions."
            fi
          fi
        fi

    - name: Report the result
      if: always() && inputs.report-url != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT_URL: ${{ inputs.report-url }}
        REPORT_TOKEN: ${{ inputs.report-token }}
      run: |
        if [ -s "$RUNNER_TEMP/tackle-result.json" ]; then
          DATA=(--data-binary "@$RUNNER_TEMP/tackle-result.json")
        else
          echo "::warning::tackle-result.json is missing or empty; reporting an error result."
          DATA=(--data '{"ok":false,"outcome":"error","error":"no result produced"}')
        fi
        if ! curl -sS --max-time 30 -X POST \
          -H "Authorization: Bearer $REPORT_TOKEN" \
          -H "Content-Type: application/json" \
          "${DATA[@]}" "$REPORT_URL"; then
          echo "::warning::Failed to POST the result to report-url (the run outcome is unaffected)."
        fi

    - name: Propagate the run exit code
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "${EXIT_CODE:-1}"
