name: 'Tackle Respond'
description: 'Act on /tackle pull request comments: apply the requested change, push it to the PR branch, and reply in the thread.'
author: 'Jordan Dalton'

branding:
  icon: 'message-circle'
  color: 'green'

inputs:
  api-key:
    description: 'API key for the configured provider. Exported as <PROVIDER>_API_KEY.'
    required: false
    default: ''
  provider:
    description: 'laravel/ai provider name. Defaults to the app''s configured provider.'
    required: false
    default: ''
  model:
    description: 'Model to use. Defaults to the app''s configured model.'
    required: false
    default: ''
  anthropic-api-key:
    description: 'Anthropic API key shorthand.'
    required: false
    default: ''
  price-input:
    description: 'Input price per million tokens, for accurate budget enforcement.'
    required: false
    default: ''
  price-output:
    description: 'Output price per million tokens, for accurate budget enforcement.'
    required: false
    default: ''
  github-token:
    description: 'Token used to fetch context, push the fix commit, and reply. Needs contents: write and pull-requests: write.'
    required: false
    default: ${{ github.token }}
  pr-number:
    description: 'Pull request number. When set (e.g. from a repository_dispatch payload), the event-based trigger checks are skipped — the dispatcher is expected to have validated the comment already.'
    required: false
    default: ''
  comment-id:
    description: 'ID of the comment to act on. Required in dispatch mode (when pr-number is set).'
    required: false
    default: ''
  comment-type:
    description: 'Comment type in dispatch mode: issue (conversation comment) or review (diff comment).'
    required: false
    default: 'issue'
  trigger:
    description: 'The comment text that activates the action. Slash style by default — "@tackle" would ping the unrelated GitHub user @Tackle on every use.'
    required: false
    default: '/tackle'
  allowed-associations:
    description: 'Comma-separated author_association values allowed to trigger a run.'
    required: false
    default: 'OWNER,MEMBER,COLLABORATOR'
  budget:
    description: 'Spend limit in USD for this run.'
    required: false
    default: ''
  php-version:
    description: 'PHP version to set up.'
    required: false
    default: '8.3'
  working-directory:
    description: 'Directory containing the Laravel app, for monorepos.'
    required: false
    default: '.'
  report-url:
    description: 'URL to POST the JSON result (tackle-result.json) to after the run, e.g. a Tackle Cloud ingest endpoint. Reporting is skipped when empty.'
    required: false
    default: ''
  report-started-url:
    description: 'URL to POST an empty "run started" ping to before the run begins (e.g. a Tackle Cloud status endpoint). Skipped when empty.'
    required: false
    default: ''
  report-progress-url:
    description: 'URL to POST the agent''s accumulated diagnostic output to every few seconds while it works (e.g. a Tackle Cloud progress endpoint). Skipped when empty.'
    required: false
    default: ''
  report-token:
    description: 'Bearer token sent in the Authorization header when posting the result to report-url.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Best-effort log hygiene: the ingest token also appears in the
    # repository_dispatch client_payload (visible to repo readers), so this
    # only reduces incidental exposure in later step logs.
    - name: Mask the report token
      if: inputs.report-token != ''
      shell: bash
      env:
        REPORT_TOKEN: ${{ inputs.report-token }}
      run: echo "::add-mask::$REPORT_TOKEN"

    - name: Report the run start
      if: inputs.report-started-url != '' || inputs.report-url != ''
      shell: bash
      env:
        STARTED_URL: ${{ inputs.report-started-url }}
        REPORT_URL: ${{ inputs.report-url }}
        REPORT_TOKEN: ${{ inputs.report-token }}
      run: |
        # Derive from the result URL when not given explicitly.
        STARTED_URL="${STARTED_URL:-${REPORT_URL%/result}/started}"
        curl -sS --max-time 15 -X POST \
          -H "Authorization: Bearer $REPORT_TOKEN" \
          "$STARTED_URL" >/dev/null \
          || echo "::warning::Failed to POST the started ping (the run is unaffected)."

    - name: Resolve the trigger context
      id: ctx
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
        REVIEW_PR: ${{ github.event.pull_request.number }}
        ISSUE_PR: ${{ github.event.issue.number }}
        IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
        EVENT_COMMENT_ID: ${{ github.event.comment.id }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_COMMENT_ID: ${{ inputs.comment-id }}
        INPUT_COMMENT_TYPE: ${{ inputs.comment-type }}
        TRIGGER: ${{ inputs.trigger }}
        ALLOWED: ${{ inputs.allowed-associations }}
      run: |
        # Dispatch mode: the caller supplies the context explicitly and has
        # already validated the trigger string and author association.
        if [ -n "$INPUT_PR_NUMBER" ]; then
          if [ -z "$INPUT_COMMENT_ID" ]; then
            echo "::error::comment-id is required when pr-number is provided."
            exit 1
          fi
          echo "pr=$INPUT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "type=${INPUT_COMMENT_TYPE:-issue}" >> "$GITHUB_OUTPUT"
          echo "comment-id=$INPUT_COMMENT_ID" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "comment-id=$EVENT_COMMENT_ID" >> "$GITHUB_OUTPUT"

        case "$EVENT_NAME" in
          pull_request_review_comment)
            echo "pr=$REVIEW_PR" >> "$GITHUB_OUTPUT"
            echo "type=review" >> "$GITHUB_OUTPUT"
            ;;
          issue_comment)
            if [ "$IS_PR_COMMENT" != "true" ]; then
              echo "::error::This comment is on an issue, not a pull request."
              exit 1
            fi
            echo "pr=$ISSUE_PR" >> "$GITHUB_OUTPUT"
            echo "type=issue" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::tackle-review/respond must run on issue_comment or pull_request_review_comment events (got: $EVENT_NAME)."
            exit 1
            ;;
        esac

        case "$COMMENT_BODY" in
          *"$TRIGGER"*) ;;
          *)
            echo "::error::Comment does not mention $TRIGGER. Add an if: guard to the workflow to skip these runs cheaply."
            exit 1
            ;;
        esac

        # Only trusted users may put the agent to work — issue_comment fires
        # for anyone, including drive-by commenters on public repos.
        case ",$ALLOWED," in
          *",$COMMENT_ASSOCIATION,"*) ;;
          *)
            echo "::error::Comment author association '$COMMENT_ASSOCIATION' is not in the allowed list ($ALLOWED)."
            exit 1
            ;;
        esac

    - name: Require an API key
      if: inputs.api-key == '' && inputs.anthropic-api-key == '' && inputs.provider != 'ollama'
      shell: bash
      run: |
        echo "::error::No API key provided. Set api-key (with provider) or anthropic-api-key."
        exit 1

    - name: Check out the pull request head
      uses: actions/checkout@v4
      with:
        ref: refs/pull/${{ steps.ctx.outputs.pr }}/head
        fetch-depth: 0
        token: ${{ inputs.github-token }}

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none

    - name: Install Composer dependencies
      uses: ramsey/composer-install@v3
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Verify Laravel Tackle is installed
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if ! composer show jordandalton/laravel-tackle >/dev/null 2>&1; then
          echo "::error::jordandalton/laravel-tackle is not installed in this app. Run: composer require jordandalton/laravel-tackle"
          exit 1
        fi

    - name: Run Tackle respond
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.ctx.outputs.pr }}
        COMMENT_ID: ${{ steps.ctx.outputs.comment-id }}
        COMMENT_TYPE: ${{ steps.ctx.outputs.type }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_PRICE_INPUT: ${{ inputs.price-input }}
        INPUT_PRICE_OUTPUT: ${{ inputs.price-output }}
        INPUT_BUDGET: ${{ inputs.budget }}
        REPORT_PROGRESS_URL: ${{ inputs.report-progress-url }}
        REPORT_URL_FOR_DERIVE: ${{ inputs.report-url }}
        REPORT_TOKEN: ${{ inputs.report-token }}
      run: |
        if [ -n "$INPUT_ANTHROPIC_API_KEY" ]; then
          export ANTHROPIC_API_KEY="$INPUT_ANTHROPIC_API_KEY"
        fi

        if [ -n "$INPUT_API_KEY" ]; then
          PROVIDER="${INPUT_PROVIDER:-anthropic}"
          KEY_VAR="$(echo "$PROVIDER" | tr '[:lower:]-' '[:upper:]_')_API_KEY"
          export "$KEY_VAR=$INPUT_API_KEY"
        fi

        if [ -n "$INPUT_PROVIDER" ]; then export AI_CODE_PROVIDER="$INPUT_PROVIDER"; fi
        if [ -n "$INPUT_MODEL" ]; then export AI_CODE_MODEL="$INPUT_MODEL"; fi
        if [ -n "$INPUT_PRICE_INPUT" ]; then export AI_CODE_PRICE_INPUT="$INPUT_PRICE_INPUT"; fi
        if [ -n "$INPUT_PRICE_OUTPUT" ]; then export AI_CODE_PRICE_OUTPUT="$INPUT_PRICE_OUTPUT"; fi

        ARGS=(--pr="$PR_NUMBER" --comment-id="$COMMENT_ID" --comment-type="$COMMENT_TYPE" --output=json)
        if [ -n "$INPUT_BUDGET" ]; then ARGS+=(--budget="$INPUT_BUDGET"); fi

        # In JSON mode the machine-readable result goes to stdout and human
        # diagnostics go to stderr. Capture the exit code without failing the
        # step; it is re-raised after the result has been reported.
        PROGRESS_LOG="$RUNNER_TEMP/tackle-progress.log"
        : > "$PROGRESS_LOG"
        PROGRESS_PID=""
        REPORT_PROGRESS_URL="${REPORT_PROGRESS_URL:-${REPORT_URL_FOR_DERIVE:+${REPORT_URL_FOR_DERIVE%/result}/progress}}"
        if [ -n "$REPORT_PROGRESS_URL" ] && [ -n "$REPORT_TOKEN" ]; then
          (
            while sleep 4; do
              [ -s "$PROGRESS_LOG" ] || continue
              curl -sS --max-time 10 -X POST \
                -H "Authorization: Bearer $REPORT_TOKEN" \
                -H "Content-Type: text/plain" \
                --data-binary @"$PROGRESS_LOG" "$REPORT_PROGRESS_URL" >/dev/null 2>&1 || true
            done
          ) &
          PROGRESS_PID=$!
        fi

        set +e
        php artisan ai:respond "${ARGS[@]}" > "$RUNNER_TEMP/tackle-result.json" 2> >(tee -a "$PROGRESS_LOG" >&2)
        EXIT_CODE=$?
        set -e
        if [ -n "$PROGRESS_PID" ]; then kill "$PROGRESS_PID" 2>/dev/null || true; fi
        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        echo "Tackle finished with exit code $EXIT_CODE (result in tackle-result.json)."

    - name: Report the result
      if: always() && inputs.report-url != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT_URL: ${{ inputs.report-url }}
        REPORT_TOKEN: ${{ inputs.report-token }}
      run: |
        if [ -s "$RUNNER_TEMP/tackle-result.json" ]; then
          DATA=(--data-binary "@$RUNNER_TEMP/tackle-result.json")
        else
          echo "::warning::tackle-result.json is missing or empty; reporting an error result."
          DATA=(--data '{"ok":false,"outcome":"error","error":"no result produced"}')
        fi
        if ! curl -sS --max-time 30 -X POST \
          -H "Authorization: Bearer $REPORT_TOKEN" \
          -H "Content-Type: application/json" \
          "${DATA[@]}" "$REPORT_URL"; then
          echo "::warning::Failed to POST the result to report-url (the run outcome is unaffected)."
        fi

    - name: Propagate the run exit code
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "${EXIT_CODE:-1}"
